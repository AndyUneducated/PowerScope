name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PowerScope.xcodeproj \
            -scheme PowerScope \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            | grep -E "Test run|✔|✘|error:|TEST (SUCCEEDED|FAILED)"
